<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS Test - Maylan's Homepage</title>
	<link rel="stylesheet" href="static/styles.css">
</head>
<body class="theme-barrens">
	<div id="header">
		<h3>CSS Element Test</h3>
	</div>

	<div id="box">
		<p>
			<button type="button" class="og-btn">copy image</button>
			<button type="button" class="og-btn">save image</button>
			<button type="button" class="og-btn">open in new tab</button>
		</p>

		<p>
			<label for="test-select">Character</label><br>
			<select id="test-select" class="og-field">
				<option value="Niko">Niko</option>
				<option value="Calamus">Calamus</option>
				<option value="Alula">Alula</option>
				<option value="Rue">Rue</option>
			</select>
		</p>

		<p>
			<label for="test-input">Short Input</label><br>
			<input id="test-input" type="text" class="og-field" value="sample text">
		</p>

		<p>
			<label for="test-textarea">Text to render</label><br>
			<textarea id="test-textarea" class="og-field">*cat noises*</textarea>
		</p>
	</div>
</body>
</html>
